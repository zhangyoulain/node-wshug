<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>保护海洋 · Protect the Ocean</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #0077b6;
      --primary-dark: #023e8a;
      --accent: #00b4d8;
      --bg: #f5f7fb;
      --text: #1f2933;
      --muted: #6b7280;
      --white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(2, 62, 138, 0.96);
      backdrop-filter: blur(10px);
      color: var(--white);
    }
    .nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .nav-logo span.icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .nav-links {
      display: flex;
      gap: 1.2rem;
      font-size: 0.95rem;
    }
    .nav-links a {
      color: #e5f2ff;
      font-weight: 500;
    }
    .nav-links a:hover {
      color: #ffffff;
    }

    .hero {
      background: linear-gradient(135deg, #001d3d, #003566);
      color: var(--white);
      padding: 4.5rem 1.5rem 4rem;
    }
    .hero-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: 2.5rem;
      align-items: center;
    }
    .hero-title {
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }
    .hero-subtitle {
      font-size: 1.05rem;
      color: #d1e4ff;
      margin-bottom: 1.8rem;
    }
    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
    }
    .badge {
      font-size: 0.8rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e0f4ff;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.18s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #002233;
      box-shadow: 0 10px 25px rgba(0, 180, 216, 0.35);
    }
    .btn-primary:hover {
      background: #48cae4;
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(0, 180, 216, 0.45);
    }
    .btn-outline {
      background: transparent;
      color: #e0f4ff;
      border: 1px solid rgba(226, 232, 240, 0.6);
    }
    .btn-outline:hover {
      background: rgba(15, 23, 42, 0.4);
    }
    .hero-visual {
      position: relative;
      min-height: 220px;
    }
    .hero-card {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 18px;
      padding: 1.4rem 1.5rem;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.4);
    }
